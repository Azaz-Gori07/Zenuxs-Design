[package]
name = "figcraft-ai-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft's AI transport: the HTTPS clients for the OpenAI, Anthropic and Google protocols, streaming their answers over the provider's own event format (desktop only; the browser build speaks through the page instead)"

[lints]
workspace = true

[dependencies]
figcraft-ai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
url = "2"

# The desktop transport: a blocking client, as FigCraft has no async runtime anywhere. The
# browser build compiles without it and answers through the page's own fetch instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
hmac = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

# The browser transport: the page's `fetch`, its streamed body and the abort signal that stops
# it. A page has no threads, so the request is a promise the event loop drives.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Location",
    "Headers", "Request", "RequestInit", "Response", "ResponseType",
    "ReadableStream", "ReadableStreamDefaultReader",
    "AbortController", "AbortSignal", "DomException",
] }

[dev-dependencies]
