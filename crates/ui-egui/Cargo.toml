[package]
name = "figcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft egui frontend (the Figma-style UI: canvas, toolbar, layers, design and prototype panels, menus); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
figcraft-geom = { workspace = true }
figcraft-color = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-text = { workspace = true }
figcraft-layout = { workspace = true }
figcraft-render = { workspace = true }
figcraft-pathops = { workspace = true }
figcraft-engine = { workspace = true }
figcraft-ai = { workspace = true }
figcraft-format = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
egui_extras = { workspace = true }
web-time = "1.1.0"

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
wat = { workspace = true }
# Keep the test font features explicit; production uses the same bundled fallback faces.
# Dependency dev-features do not propagate into app release builds.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# A dropped file in a page is a handle the browser reads, not a path; `open.rs` needs it named.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts", "web_file"] }
# The image tools are network calls, and a page has no thread to block: each runs as a future
# the page's event loop drives.
wasm-bindgen-futures = "0.4"
# A rate-limited picture is retried after a moment, and on a page the wait is a timer rather
# than a sleeping thread.
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }
